[project]
name = "elixir"
version = "0.1.0"
description = "Human-equal web entity: wigolo + obscura + cloak + cua-driver router"
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "pyyaml>=6.0", "rich>=13.0"]
authors = [{name = "Raja"}]
license = {file = "LICENSE"}

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyflakes>=3.0", "build>=1.0"]

[project.scripts]
elixir = "elixir.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elixir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
