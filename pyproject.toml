[project]
name = "elixir"
version = "0.1.0"
description = "Human-equal web entity: wigolo + obscura + cloak + cua-driver router"
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "pyyaml>=6.0", "rich>=13.0"]
authors = [{name = "Raja"}]

[project.scripts]
elixir = "elixir.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elixir"]
